<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diskus Balığı Üretim Yönetimi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
      :root {
        --primary: #3b82f6;
        --primary-dark: #2563eb;
        --dark: #1e293b;
        --darker: #0f172a;
        --light: #f8fafc;
        --gray: #94a3b8;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: linear-gradient(135deg, var(--darker), var(--dark));
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 500px;
        position: relative;
      }

      .logo {
        text-align: center;
        margin-bottom: 30px;
      }

      .logo i {
        font-size: 48px;
        color: var(--primary);
        margin-bottom: 10px;
      }

      h1 {
        font-size: 35px;
        color: var(--light);
        margin-bottom: 10px;
        font-weight: 700;
      }

      .subtitle {
        font-size: 18px;
        color: var(--gray);
        margin-bottom: 40px;
        line-height: 1.6;
      }

      .form-box {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .form-header {
        text-align: center;
        margin-bottom: 30px;
      }

      .form-header h2 {
        color: var(--light);
        font-size: 28px;
        font-weight: 600;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 25px;
      }

      .input-container {
        position: relative;
        margin-bottom: 20px;
      }

      .input-field {
        width: 100%;
        padding: 15px 45px 15px 20px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.05);
        color: var(--light);
        font-size: 16px;
        transition: all 0.3s ease;
      }

      .input-field:focus {
        border-color: var(--primary);
        outline: none;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
      }

      .label-name {
        display: block;
        margin-bottom: 8px;
        color: var(--gray);
        font-size: 16px;
        font-weight: 500;
        text-align: left;
      }

      .password-toggle {
        position: absolute;
        right: 15px;
        top: 55px;
        transform: translateY(-50%);
        cursor: pointer;
        color: var(--gray);
        font-size: 16px;
      }

      .submit-btn {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 10px;
        background: var(--primary);
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
      }

      .submit-btn:hover {
        background: var(--primary-dark);
        transform: translateY(-2px);
      }

      @media (max-width: 480px) {
        .form-box {
          padding: 30px 20px;
        }

        h1 {
          font-size: 28px;
        }

        .subtitle {
          font-size: 16px;
        }

        .form-header h2 {
          font-size: 24px;
        }

        .input-field {
          padding: 12px 40px 12px 15px;
        }

        .password-toggle {
          top: 38px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <i class="fas fa-fish"></i>
        <h1>Diskus Balığı Üretim Yönetimi</h1>
        <p class="subtitle">
          Diskus balığı üretim süreçlerinizi profesyonelce yönetin. Tank takibi, su parametreleri, besleme programları
          ve daha fazlası.
        </p>
      </div>

      <div class="form-box">
        <div class="form-header">
          <h2>Giriş Yap</h2>
        </div>

        <form id="Login" class="input-group">
          <div class="input-container">
            <label class="label-name">Kullanıcı Adı</label>
            <input type="text" id="kullaniciadi" class="input-field" required />
          </div>

          <div class="input-container">
            <label class="label-name">Şifre</label>
            <input type="password" id="password" class="input-field" required />
            <i class="fas fa-eye password-toggle" id="togglePassword"></i>
          </div>

          <button type="submit" class="submit-btn">Giriş Yap</button>
        </form>
      </div>
    </div>

    <script>
      const togglePassword = document.querySelector("#togglePassword");
      const password = document.querySelector("#password");

      togglePassword.addEventListener("click", function (e) {
        const type = password.getAttribute("type") === "password" ? "text" : "password";
        password.setAttribute("type", type);
        this.classList.toggle("fa-eye-slash");
      });
    </script>
  </body>
</html>
